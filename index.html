<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <script type="module" src="script.js" ></script>
        <title>Document</title>
    </head>
    <body>
        <nav id="nav-bar">
            <a href="#" class="nav-brand">My Nutrition</a>
        </nav>

        <div class="container" id="main">
            <h2>Add food</h2>
            <form id="create-form">
                <label for="create-name">Food name:</label>
                <select id="create-name">
                    <option value="">Select option</option>
                    <option value="Pizza">Pizza</option>
                    <option value="Cottage cheese">Cottage Cheese</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Soup">Soup</option>
                    <option value="Sushi">Sushi</option>
                    <option value="Apple">Apple</option>
                    <option value="Orange">Orange</option>
                </select>
                <div class="nutrition-values">
                    <label for="create-carbs">Carbs:</label>
                    <input
                        class="nutrition-input"
                        type="number"
                        id="create-carbs"
                        min="0"
                        max="200"
                        placeholder="0g"
                    />
                    <label for="create-protein">Protein:</label>
                    <input
                        class="nutrition-input"
                        type="number"
                        id="create-protein"
                        min="0"
                        max="200"
                        placeholder="0g"
                    />
                    <label for="create-fat">Fat:</label>
                    <input
                        class="nutrition-input"
                        type="number"
                        id="create-fat"
                        min="0"
                        max="200"
                        placeholder="0g"
                    />
                    <div></div>
                    <input type="submit" class="btn btn-default create-submit" value="Add" />
                </div>
            </form>
            <h2>Log</h2>
            <div class="card" id="total-calories-container">
                <h3>Total calories logged: <span id="total-calories">0</span></h3>
            </div>
            <ul id="food-list"></ul>
        </div>
    </body>
</html>
    


<li class="card">
  <div>
    <h3 class="name">NAME</h3>
    <div class="calories">0 calories</div>
    <ul class="macros">
      <li class="carbs"><div>Carbs</div><div class="value">CARBSg</div></li>
      <li class="protein"><div>Protein</div><div class="value">PROTEINg</div></li>
      <li class="fat"><div>Fat</div><div class="value">FATg</div></li>
    </ul>
  </div>
</li>
